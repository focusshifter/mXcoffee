[package]
name = "mxcoffee"
version = "0.1.0"
authors = ["Victor Shcherbakov <me@v1x.info>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "mxcoffee"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embedded-graphics = "0.8.1"
mipidsi = "0.9.0"
esp-idf-sys = "0.36.1"
display-interface-spi = "0.5.0"
embedded-svc = "0.28.1"
esp-idf-hal = "0.45.2"
embedded-hal = "1.0.0"
axp2101 = "0.1.0"

[build-dependencies]
embuild = "0.33"
